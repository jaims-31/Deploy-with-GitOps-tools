apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/jaims-31/Deploy-with-GitOps-tools.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
