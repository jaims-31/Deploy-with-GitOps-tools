apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-app
  template:
    metadata:
      labels:
        app: python-app
    spec:
      containers:
      - name: python-app
        image: python:3.9-slim
        command: ["python", "-c", "import time; [print('Hello GitOps - Log line', i) or time.sleep(5) for i in range(100000)]"]
---
apiVersion: v1
kind: Service
metadata:
  name: python-app-svc
  namespace: default
spec:
  selector:
    app: python-app
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
