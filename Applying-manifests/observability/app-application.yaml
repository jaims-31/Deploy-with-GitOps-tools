apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: python-app-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/jaims-31/Applying-manifests.git'
    targetRevision: HEAD
    path: manifests/app
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
