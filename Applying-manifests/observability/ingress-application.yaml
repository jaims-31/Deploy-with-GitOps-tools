apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/jaims-31/Applying-manifests.git'
    targetRevision: HEAD
    path: manifests/ingress
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
